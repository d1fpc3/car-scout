name: scout

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Force a full comps refresh
        type: boolean
        default: false

concurrency:
  group: scout
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      board: ${{ steps.board.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # State (comps pool, what's been alerted) lives in the Actions cache, never in the repo.
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Scout
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BOARD_PASSPHRASE: ${{ secrets.BOARD_PASSPHRASE }}
          QUIET: '1'
        run: node scout.mjs ${{ inputs.full && '--full' || '' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: state-${{ github.run_id }}
      # GitHub pauses cron on repos with no commits for 60 days.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "car-scout"; git config user.email "car-scout@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push
          fi
      # The deals board. board/ only exists when BOARD_PASSPHRASE is set, and it only ever
      # holds the encrypted payload (no plaintext deal data anywhere public).
      - name: Check board
        id: board
        run: test -f board/deals.json && echo "ready=true" >> "$GITHUB_OUTPUT" || echo "ready=false" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.board.outputs.ready == 'true'
        with:
          name: board
          path: board/deals.json
          retention-days: 1

  # Publishes the encrypted payload as a single orphan commit on the board-data branch
  # (force-pushed, so history never grows). d1fpc3.com/cars/deals/ reads it from there.
  board:
    needs: scout
    if: needs.scout.outputs.board == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: board
          path: board
      - name: Push board-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd board
          git init -q -b board-data
          git config user.name "car-scout"; git config user.email "car-scout@users.noreply.github.com"
          git add deals.json
          git commit -q -m "Encrypted deals board"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:board-data
